# Docker Compose for AI Army
# Production-ready configuration for PostgreSQL + app services.
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop and remove volumes (deletes data)
#   docker compose logs -f        # Follow all logs
#   docker compose logs -f app    # Follow app logs only
#
# Prerequisites:
#   - Docker with Compose V2
#   - Copy .env.example to .env and configure values

services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-army-postgres
    environment:
      POSTGRES_DB: ai_army
      POSTGRES_USER: ai_army
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_army_dev}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_army -d ai_army"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ai-army-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-army-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://ai_army:${DB_PASSWORD:-ai_army_dev}@postgres:5432/ai_army
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./bots:/app/bots:ro
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request({port: process.env.PORT || 3000, path: '/health', timeout: 2000}, res => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ai-army-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.5"

networks:
  ai-army-net:
    driver: bridge

volumes:
  pgdata:
