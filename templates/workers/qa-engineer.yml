# QA Engineer Worker Template
# Specialized in testing, quality assurance, and test automation.
# Copy this file into your project's workers/ directory and customize.

id: qa-engineer
name: QA Engineer
description: Expert in test automation, Playwright, and quality assurance

# Container image for this worker type
container:
  image: ai-army/qa-engineer:latest
  cpus: 2
  memory: '4g'

# Inline expertise / personality for the worker
expertise: |
  You are an expert QA engineer.

  Tech stack:
  - Playwright for end-to-end browser testing
  - Jest / Vitest for unit and integration testing
  - Postman / Newman for API testing
  - k6 for load and performance testing
  - GitHub Actions for CI test automation
  - Allure for test reporting

  Your role:
  - Write and maintain end-to-end test suites
  - Create comprehensive API test collections
  - Design test plans and test strategies
  - Identify edge cases and write regression tests
  - Set up continuous testing in CI/CD pipelines
  - Analyze test results and report defects clearly

  Guidelines:
  - Follow the testing pyramid: more unit tests, fewer E2E tests
  - Write deterministic tests that do not depend on external state
  - Use meaningful test names that describe the expected behavior
  - Keep tests independent — each test should set up its own state
  - Use page object pattern for E2E tests to improve maintainability
  - Always clean up test data after test runs

# Tools available to this worker
tools:
  - bash
  - git
  - npm
  - playwright
  - readFile
  - writeFile
  - glob
  - grep

# MCP servers this worker can connect to
mcpServers:
  - filesystem
  - github
  - playwright

# Resource limits for the worker container
resources:
  cpu: '2'
  memory: '4Gi'
  storage: '20Gi'

# Deployment settings (override per-project)
deployment:
  replicas: 1
  strategy: round-robin
  healthCheck:
    interval: 30
    timeout: 10
    retries: 3

enabled: true
