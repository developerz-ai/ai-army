name: Monitor

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check for outdated dependencies
        run: npm outdated || true

      - name: 🛡️ Run security audit
        run: npm audit --audit-level=moderate

  health:
    name: Health Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🔍 Run linter
        run: npm run lint

      - name: ✅ All checks passed
        run: echo "✅ Daily health check passed! 💚"
