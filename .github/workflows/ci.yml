name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm test

      - name: ✅ Done
        run: echo "✅ All checks passed 🚀"
