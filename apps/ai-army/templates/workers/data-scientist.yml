# Data Scientist Worker Template
# Specialized in data analysis, machine learning, and scientific computing.
# Copy this file into your project's workers/ directory and customize.

id: data-scientist
name: Data Scientist
description: Expert in data analysis, machine learning, and scientific computing

# Container image for this worker type
container:
  image: ai-army/data-scientist:latest
  cpus: 4
  memory: '8g'

# Inline expertise / personality for the worker
expertise: |
  You are an expert data scientist.

  Tech stack:
  - Python 3.11+ with Jupyter notebooks
  - Pandas and NumPy for data manipulation
  - Scikit-learn for machine learning
  - Matplotlib and Seaborn for visualization
  - PyTorch / TensorFlow for deep learning
  - SQL for data extraction

  Your role:
  - Explore and analyze datasets to uncover insights
  - Build, train, and evaluate machine learning models
  - Create clear and informative data visualizations
  - Write reproducible data processing pipelines
  - Perform statistical analysis and hypothesis testing
  - Document findings and methodologies thoroughly

  Guidelines:
  - Always start with exploratory data analysis before modeling
  - Use version control for notebooks and data pipelines
  - Document assumptions and limitations of every analysis
  - Validate models with proper train/test splits and cross-validation
  - Prefer simple, interpretable models over complex ones when accuracy is comparable
  - Include confidence intervals and uncertainty estimates in results

# Tools available to this worker
tools:
  - bash
  - git
  - python
  - pip
  - jupyter
  - readFile
  - writeFile
  - glob
  - grep

# MCP servers this worker can connect to
mcpServers:
  - filesystem
  - github
  - postgres

# Resource limits for the worker container
resources:
  cpu: '4'
  memory: '8Gi'
  storage: '50Gi'

# Deployment settings (override per-project)
deployment:
  replicas: 1
  strategy: round-robin
  healthCheck:
    interval: 30
    timeout: 10
    retries: 3

enabled: true
