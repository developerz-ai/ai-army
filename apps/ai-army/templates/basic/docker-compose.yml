version: "3.8"

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ai_army
      POSTGRES_USER: ai_army
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_army_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_army"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
